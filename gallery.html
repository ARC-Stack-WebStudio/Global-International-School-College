<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Campus Gallery | Global International</title>
  <meta name="description" content="Explore life at Global International High School & Jr. College.">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link href="style.css" rel="stylesheet"><link href="upgrade.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg fixed-top scrolled"><div class="container"><a class="navbar-brand" href="index.html"><span class="crest"><i class="bi bi-mortarboard-fill"></i></span><span>GLOBAL <small>INTERNATIONAL HIGH SCHOOL & JR. COLLEGE</small></span></a><a class="btn btn-gold" href="index.html#admissions">Admissions Open</a></div></nav>
<header class="inner-hero"><div class="container"><nav class="breadcrumb"><a href="index.html">Home</a><span class="mx-2">/</span> Gallery</nav><p class="eyebrow text-gold">LIFE AT GLOBAL</p><h1>Our campus,<br><em>in moments.</em></h1></div></header>
<main class="section"><div class="container">
  <div class="d-flex flex-wrap gap-1 mb-4" id="filters"><button class="gallery-filter active" data-filter="all">All</button><button class="gallery-filter" data-filter="campus">Campus</button><button class="gallery-filter" data-filter="learning">Classrooms & Labs</button><button class="gallery-filter" data-filter="events">Events</button><button class="gallery-filter" data-filter="culture">Culture & Sports</button></div>
  <div class="row g-3" id="gallery">
    <div class="col-md-6 col-lg-4 item campus"><div class="gallery-item gallery-campus" role="img" aria-label="Global International school campus" data-image="assets/campus-hero.png" data-alt="Global International school campus"><b>Campus</b></div></div>
    <div class="col-md-6 col-lg-4 item learning"><div class="gallery-item gallery-classroom" role="img" aria-label="Smart classroom with interactive learning" data-image="assets/global-smart-classroom-bhiwandi.webp" data-alt="Smart classroom with interactive learning"><b>Smart Classrooms</b></div></div>
    <div class="col-md-6 col-lg-4 item learning"><div class="gallery-item gallery-lab" role="img" aria-label="Students working in a science laboratory" data-image="assets/global-science-laboratory.webp" data-alt="Students working in a science laboratory"><b>Science Laboratories</b></div></div>
    <div class="col-md-6 col-lg-5 item culture"><div class="gallery-item gallery-sports" role="img" aria-label="Students in a school sports activity" data-image="assets/global-sports-day.webp" data-alt="Students in a school sports activity"><b>Sports & Activities</b></div></div>
    <div class="col-md-6 col-lg-3 item events"><div class="gallery-item gallery-annual" role="img" aria-label="Students performing at the annual function" data-image="assets/global-annual-day-event.webp" data-alt="Students performing at the annual function"><b>Annual Function</b></div></div>
    <div class="col-md-6 col-lg-4 item culture"><div class="gallery-item gallery-cultural" role="img" aria-label="Students participating in cultural activities" data-image="assets/global-cultural-activities.webp" data-alt="Students participating in cultural activities"><b>Cultural Activities</b></div></div>
    <div class="col-md-6 col-lg-4 item events"><div class="gallery-item gallery-exhibition" role="img" aria-label="Student projects at a science exhibition" data-image="assets/global-science-exhibition.webp" data-alt="Student projects at a science exhibition"><b>Achievements</b></div></div>
    <div class="col-md-6 col-lg-4 item campus"><div class="gallery-item gallery-library" role="img" aria-label="Modern digital library and reading space" data-image="assets/global-digital-library.webp" data-alt="Modern digital library and reading space"><b>Library</b></div></div>
  </div>
</div></main>
<div class="modal fade" id="lightbox"><div class="modal-dialog modal-lg modal-dialog-centered"><div class="modal-content"><img src="assets/campus-hero.png" class="w-100" alt="Global campus gallery preview" loading="lazy"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>document.querySelectorAll('.gallery-filter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.gallery-filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.item').forEach(x=>x.style.display=(b.dataset.filter==='all'||x.classList.contains(b.dataset.filter))?'block':'none')});document.querySelectorAll('.gallery-item').forEach(x=>x.onclick=()=>{const image=document.querySelector('#lightbox img');image.src=x.dataset.image;image.alt=x.dataset.alt;new bootstrap.Modal('#lightbox').show()})</script>
</body>
</html>
